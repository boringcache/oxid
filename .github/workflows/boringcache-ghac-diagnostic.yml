name: GitHub compiler cache diagnostic

on:
  push:
    branches: [boringcache-ghac-diagnostic]

permissions:
  contents: read

jobs:
  transport:
    if: github.repository == 'boringcache/oxid'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
      - name: Configure one GitHub compiler writer
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            core.exportVariable('ACTIONS_RESULTS_URL', process.env.ACTIONS_RESULTS_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');
            core.exportVariable('SCCACHE_GHA_ENABLED', 'on');
            core.exportVariable('SCCACHE_GHA_VERSION', 'oxid-transport-diagnostic-20260909');
            core.exportVariable('SCCACHE_GHA_RW_MODE', 'READ_WRITE');
      - name: Compile one diagnostic object and retain only error classes
        run: |
          mkdir -p diagnostic-results
          # shellcheck disable=SC2016
          nix develop .#ci-rust --command bash -c '
            set -euo pipefail
            umask 077
            export SCCACHE_LOG=debug
            export SCCACHE_ERROR_LOG="$RUNNER_TEMP/oxid-sccache-diagnostic.log"
            trap "sccache --stop-server >/dev/null 2>&1 || true" EXIT
            printf "int oxid_cache_diagnostic(void) { return 0; }\n" > "$RUNNER_TEMP/oxid-cache-diagnostic.c"
            sccache --version
            sccache cc -c "$RUNNER_TEMP/oxid-cache-diagnostic.c" -o "$RUNNER_TEMP/oxid-cache-diagnostic.o"
            sccache --show-stats --stats-format=json > diagnostic-results/sccache.json
            sccache --stop-server >/dev/null
          '
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          path = Path(os.environ['RUNNER_TEMP']) / 'oxid-sccache-diagnostic.log'
          log = path.read_text(errors='replace')
          names = ['Unexpected', 'PermissionDenied', 'RateLimited', 'NotFound', 'ConfigInvalid', 'Unsupported', 'InvalidArgument', 'Unauthenticated', 'invalid_argument', 'permission_denied', 'unauthenticated']
          result = {
              'purpose': 'One native compiler-cache write; not a workload benchmark',
              'http_status_codes': sorted(set(re.findall(r'(?i)(?:status(?:_code)?|http)[\s:=\"(]+([1-5][0-9]{2})\b', log))),
              'error_classes': [name for name in names if re.search(r'\b' + re.escape(name) + r'\b', log)],
              'raw_log_lines': len(log.splitlines()),
          }
          Path('diagnostic-results/error-classes.json').write_text(json.dumps(result, indent=2) + '\n')
          print(json.dumps(result, indent=2))
          path.unlink()
          PY
      - name: Retain native statistics and bounded diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ghac-transport-diagnostic-${{ github.run_id }}
          path: diagnostic-results
          if-no-files-found: warn
